name: openmail
label: OpenMail
kind: platform
version: 0.4.2
description: >
  Gives a Hermes agent its own email address. New setups alert the owner when mail arrives.
  Channel mode enables automatic in-thread replies. Ships native tools for sending,
  reading mail, saving and editing HTML drafts in a sending inbox, sending reviewed drafts, deleting discarded drafts,
  and provisioning, plus the OpenMail skill.
author: OpenMail
homepage: https://docs.openmail.sh/integrations/hermes
license: MIT
tags: [email, channel, openmail]
python_dependencies:
  - httpx
  - websockets
requires_env:
  - name: OPENMAIL_API_KEY
    description: "OpenMail API key. Inbox-, pod- or account-scoped. Get one at https://console.openmail.sh"
    prompt: "OpenMail API key"
    password: true
optional_env:
  - name: OPENMAIL_INBOX_ID
    description: "Inbox to run as. Only needed when the key can see several inboxes."
    prompt: "Inbox id (optional)"
    password: false
  - name: OPENMAIL_POD_ID
    description: "Run one agent for a whole pod (every inbox in it). Needs a pod- or account-scoped key."
    prompt: "Pod id (optional)"
    password: false
  - name: OPENMAIL_MODE
    description: "alert (arrival only, new setup default) | channel (automatic in-thread reply) | notify (agent summary) | tool (tools only)"
    prompt: "Mode (alert/channel/notify/tool)"
    password: false
  - name: OPENMAIL_ALLOWED_USERS
    description: "Comma-separated sender addresses allowed to talk to the agent. Hermes denies everyone else."
    prompt: "Allowed senders (comma-separated)"
    password: false
  - name: OPENMAIL_ALLOW_ALL_USERS
    description: "true to let any sender reach the agent. OpenMail's server-side allow/block rules still apply."
    prompt: "Allow all senders? (true/false)"
    password: false
  - name: OPENMAIL_HOME_ADDRESS
    description: "Address that receives cron and notification deliveries sent to `openmail`."
    prompt: "Home address (optional)"
    password: false
  - name: OPENMAIL_BASE_URL
    description: "API base URL. Default https://api.openmail.sh"
    prompt: "Base URL"
    password: false
provides_tools:
  - openmail_whoami
  - openmail_send
  - openmail_create_draft
  - openmail_list_drafts
  - openmail_get_draft
  - openmail_edit_draft
  - openmail_send_draft
  - openmail_delete_draft
  - openmail_reply
  - openmail_list_threads
  - openmail_read_thread
  - openmail_list_messages
  - openmail_create_folder
  - openmail_rename_folder
  - openmail_delete_folder
  - openmail_move_message
  - openmail_restore_message
  - openmail_list_scheduled_sends
  - openmail_reschedule_scheduled_send
  - openmail_cancel_scheduled_send
  - openmail_list_folders
  - openmail_list_folder_messages
  - openmail_attachment_text
  - openmail_list_inboxes
  - openmail_create_inbox
